<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Image and List Demo</title>
</head>

<body>

    <h1>Image Tag</h1>

    <h2>Local Image</h2>
    <img src="images/ezgif-61058bc1f858339e.jpg" alt="College" width="300">

    <h2>Ordered List</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h2>Unordered List</h2>
    <ul>
        <li>Computer</li>
        <li>Laptop</li>
        <li>Printer</li>
    </ul>

</body>

</html>
