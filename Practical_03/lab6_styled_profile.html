<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6 - Styled Student Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .profile {
            background: white;
            padding: 30px;
            border: 2px solid #2c3e50;
            border-radius: 10px;
            width: 400px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #333;
            line-height: 1.8;
        }

        strong {
            color: #2980b9;
        }
    </style>
</head>

<body>
    <div class="profile">
        <h1>Student Profile</h1>
        <p><strong>Name:</strong> Uday Pratap Singh</p>
        <p><strong>Department:</strong> CSE (Cyber Security)</p>
        <p><strong>Semester:</strong> V</p>
        <p><strong>Interest:</strong> Web Technology</p>
    </div>
</body>

</html>
