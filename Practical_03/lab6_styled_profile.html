<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lab 6 - Styled Student Profile</title>
    <style>
        .profile {
            width: 350px;
            margin: 40px auto;
            padding: 25px;
            border: 2px solid navy;
            background-color: #f9f9f9;
            text-align: center;
        }

        h1 {
            color: navy;
        }

        p {
            font-size: 17px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>Student Profile</h1>

        <p><strong>Name:</strong> Saurabh</p>
        <p><strong>Department:</strong> CSE</p>
        <p><strong>Semester:</strong> VII</p>
        <p><strong>Interest:</strong> Web Technology</p>

    </div>

</body>

</html>
