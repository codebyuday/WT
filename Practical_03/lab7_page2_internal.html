<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7 - Page 2 (Internal CSS)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        h2 {
            color: #2980b9;
        }

        p {
            font-size: 16px;
            color: #333;
        }

        .highlight {
            background-color: #3498db;
            color: white;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Scope Experiment</h1>

    <h2>Page 2 - Internal CSS</h2>

    <p>This page uses <strong>Internal CSS</strong>.</p>

    <p class="highlight">
        Internal CSS is placed inside &lt;style&gt; tag in the &lt;head&gt; section.
    </p>

</body>

</html>
