<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lab 7 - Page 2 Internal CSS</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
        }

        h1 {
            color: navy;
            text-align: center;
        }

        h2 {
            color: blue;
        }

        .note {
            background-color: #333;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Scope Experiment</h1>

    <h2>Page 2 - Internal CSS</h2>

    <p>This page uses internal CSS.</p>

    <p class="note">
        Internal CSS is written inside the style tag in the head section.
    </p>

</body>

</html>
